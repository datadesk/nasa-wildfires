name: Testing and deployment
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint-python:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Check with Ruff
        run: uv run ruff check

      - name: Check formatting with Ruff
        run: uv run ruff format --check

  type-check-python:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Check types with ty
        run: uv run ty check

  test-python:
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    name: Test
    runs-on: ubuntu-latest
    needs: [lint-python, type-check-python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install Python
        run: uv python install ${{ matrix.python }}

      - name: Install Python dependencies
        run: uv sync --group test --python ${{ matrix.python }}

      - name: Run offline tests
        run: uv run pytest

  test-live:
    name: Test against NASA's real website
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install Python dependencies
        run: uv sync --group test

      - name: Run live tests
        run: uv run pytest -m live

  test-build:
    name: Build Python package
    runs-on: ubuntu-latest
    needs: [test-python]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Install Python dependencies
        run: uv sync --group dev

      - id: build
        name: Build release
        run: |
          uv build --sdist --wheel
          ls -l dist

      - id: check
        name: Check release
        run: uv run twine check dist/*

      - id: save
        name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-release-${{ github.run_number }}
          path: ./dist
          if-no-files-found: error

  tag-release:
    name: Tagged PyPI release
    runs-on: ubuntu-latest
    needs: [test-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags')
    environment:
      name: pypi
      url: https://pypi.org/project/nasa-wildfires/
    permissions:
      id-token: write  # lets PyPI trust this workflow without a saved password
    steps:
      - id: fetch
        name: Fetch artifact
        uses: actions/download-artifact@v4
        with:
          name: test-release-${{ github.run_number }}
          path: ./dist

      - id: publish
        name: Publish release
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          verbose: true
          verify_metadata: false
